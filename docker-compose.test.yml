# Dedicated Postgres for the test suite.
# Usage: docker compose -f docker-compose.test.yml up -d --wait && uv run pytest
services:
  db-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: archive_test
      POSTGRES_PASSWORD: archive_test
      POSTGRES_DB: archive_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive_test -d archive_test"]
      interval: 2s
      timeout: 2s
      retries: 30